name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # setup-node's bundled npm (11.x on Node 24) already supports OIDC trusted
      # publishing; intentionally not upgrading to npm@latest here.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --version
      - run: npm --version
      - run: npm publish --loglevel verbose
