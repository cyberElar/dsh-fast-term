name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g npm@latest
      - run: npm --version
      # Staged publishing: CI only submits the tarball; a maintainer must approve
      # it with 2FA (npm stage approve / npmjs.com) before it goes live.
      - run: npm stage publish
