name: OIDC debug

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Show npm and node
        run: |
          node --version
          npm --version
      - name: Check OIDC env
        run: |
          node -e "console.log('ID_TOKEN_URL:', Boolean(process.env.ACTIONS_ID_TOKEN_REQUEST_URL))"
          node -e "console.log('REQ_TOKEN:', Boolean(process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN))"
      - name: Mint OIDC token
        run: |
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | head -c 120
          echo
